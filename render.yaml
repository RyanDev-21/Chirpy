# Render Blueprint: New > Blueprint > pick this repo.
# Values marked `sync: false` are asked for in the dashboard on first
# deploy and never stored in git.
services:
    - type: web
      name: chirpy-api
      runtime: docker
      plan: free
      region: singapore
      branch: main
      # deploy only after the GitHub checks (CI) on the commit pass
      autoDeployTrigger: checksPass
      # /livez touches neither Postgres nor Redis, so health checks do not
      # keep the serverless database awake
      healthCheckPath: /livez
      envVars:
          - key: PLATFORM
            value: prod
          - key: SECRET
            generateValue: true
          - key: DB_URL
            sync: false
          - key: REDIS_URL
            sync: false
          # email codes (sign-up verification, password reset)
          - key: RESEND_API_KEY
            sync: false
          - key: MAIL_FROM
            value: Chirpy <no-reply@mail.ponypigeon.com>
          # Google sign-in: the Web client ID(s) the Android app uses as serverClientId
          - key: GOOGLE_CLIENT_IDS
            sync: false
          # Firebase service account key (JSON) for push; set in the dashboard
          - key: FIREBASE_SERVICE_ACCOUNT
            sync: false
          # Cloudflare Realtime TURN for voice calls (set in the dashboard)
          - key: CF_TURN_KEY_ID
            sync: false
          - key: CF_TURN_API_TOKEN
            sync: false
          # Cloudflare R2 for photos and videos (set in the dashboard)
          - key: R2_ACCOUNT_ID
            sync: false
          - key: R2_BUCKET
            sync: false
          - key: R2_ACCESS_KEY_ID
            sync: false
          - key: R2_SECRET_ACCESS_KEY
            sync: false
          # APK release info for GET /api/app/version (see DEPLOY.md)
          - key: APP_LATEST_VERSION
            sync: false
          - key: APP_MIN_VERSION
            sync: false
          - key: APP_DOWNLOAD_URL
            sync: false
          - key: APP_SHA256
            sync: false
          - key: APP_RELEASE_NOTES
            sync: false
          # metrics to Grafana Cloud (see monitoring/README.md)
          - key: OTEL_EXPORTER_OTLP_ENDPOINT
            sync: false
          - key: OTEL_EXPORTER_OTLP_HEADERS
            sync: false
          # free Upstash is billed per command; Redis Streams polling would
          # use the monthly allowance while idle
          - key: QUEUE_BACKEND
            value: memory
          - key: DB_MAX_CONNS
            value: "5"
          - key: DB_MAX_IDLE_TIME
            value: 2m
          - key: REDIS_POOL_SIZE
            value: "10"
          # requests pass Cloudflare's edge, then Render: two public proxies
          # (Render's internal 10.x hops are skipped automatically). Checked
          # with a tagged request: 1 resolved to a Cloudflare address.
          - key: TRUSTED_PROXIES
            value: "2"
          - key: LOG_FORMAT
            value: json
          - key: LOG_LEVEL
            value: info
