name: Weekly vulnerability scan

# New Go and library vulnerabilities are published even when our code
# doesn't change. GitHub emails the repository owner when this fails.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC (10:00 in Bangkok)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
