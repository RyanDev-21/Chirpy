# Benchmark stack: `make bench` (Render free) or `BENCH_CPUS=1 make bench` (VPS).
# The server runs with Render free's limits by default: 0.1 CPU, 512 MB.
name: chirpy-bench
services:
  postgres:
    image: postgres:18
    environment: {POSTGRES_USER: chirpy, POSTGRES_PASSWORD: chirpy, POSTGRES_DB: bench}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    ports: ["127.0.0.1:57432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "chirpy"], interval: 2s, retries: 30}
  redis:
    image: redis:8
    ports: ["127.0.0.1:57379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30}
  server:
    build: {context: .., dockerfile: Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      PLATFORM: test
      DB_URL: postgres://chirpy:chirpy@postgres:5432/bench?sslmode=disable
      REDIS_ADDR: redis:6379
      SECRET: ${BENCH_SECRET:?generated by make bench}
      LOG_LEVEL: warn
      QUEUE_BACKEND: memory # as on Render (render.yaml)
    ports: ["127.0.0.1:57080:8080"]
    cpus: ${BENCH_CPUS:-0.1}
    mem_limit: 512m
